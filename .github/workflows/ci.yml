name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Inclui os testes do banco (isolamento entre organizações, modelo único, imutabilidade) em Postgres via PGlite.
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Auditoria de dependências
        run: pnpm audit --prod --audit-level high
