      HISTÓRIAS SOCIAIS — FOLHA DE MODELO DE PERSONAGEM
    </text>
    <text y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#607D8B">
      Personagem Consistente: Léo (7 anos) • Proporções Naturais • Expressão Neutro-Amigável
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 1. VISTA LATERAL (PERFIL ESQUERDO) - X: 280 -->
  <!-- ========================================== -->
  <g transform="translate(280, 0)">
