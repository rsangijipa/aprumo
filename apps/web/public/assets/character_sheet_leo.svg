    <path d="M-50 216 C-52 155, 52 158, 50 216 C38 185, 4 175, -16 186 C-30 193, -44 196, -50 216 Z" fill="url(#hairGrad)"/>

    <!-- Cheeks -->
    <circle cx="-18" cy="250" r="10" fill="#E74C3C" opacity="0.16"/>
    <circle cx="28" cy="250" r="10" fill="#E74C3C" opacity="0.16"/>

    <!-- Eyes 3/4 -->
    <ellipse cx="-12" cy="232" rx="5" ry="7" fill="#263238"/>
    <circle cx="-10" cy="229" r="2" fill="#FFFFFF"/>
    <ellipse cx="24" cy="232" rx="5.5" ry="7.5" fill="#263238"/>
    <circle cx="26" cy="229" r="2.2" fill="#FFFFFF"/>

