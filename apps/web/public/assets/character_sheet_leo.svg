    <circle cx="-60" cy="548" r="15" fill="url(#skinGrad)"/>

    <!-- Right Arm 3/4 -->
    <rect x="42" y="348" width="28" height="190" rx="14" fill="url(#shirtGrad)"/>
    <circle cx="56" cy="550" r="15" fill="url(#skinGrad)"/>

