    <rect x="-14" y="292" width="28" height="44" rx="10" fill="url(#skinGrad)"/>

    <!-- Head 3/4 -->
    <ellipse cx="-3" cy="235" rx="50" ry="56" fill="url(#skinGrad)"/>
    <circle cx="48" cy="236" r="11" fill="url(#skinGrad)"/>

