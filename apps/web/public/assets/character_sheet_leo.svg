    <path d="M-28 220 Q-20 216 -12 220" stroke="#4E3127" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M12 220 Q20 216 28 220" stroke="#4E3127" stroke-width="3.5" fill="none" stroke-linecap="round"/>

