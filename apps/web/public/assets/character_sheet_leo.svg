    <path d="M4 242 Q9 248 3 250" stroke="#E59866" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Smile 3/4 -->
    <path d="M-4 265 Q8 273 20 263" stroke="#B03A2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>

