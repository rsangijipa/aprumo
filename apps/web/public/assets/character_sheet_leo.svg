    <path d="M-15 735 L-15 770 C-15 780, 4 782, 32 782 L50 782 C56 782, 60 776, 56 770 L46 750 L10 735 Z" fill="url(#shoesGrad)"/>
    <rect x="-16" y="768" width="74" height="15" rx="7" fill="#FFFFFF"/>

