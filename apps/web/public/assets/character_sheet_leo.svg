    <path d="M-35 340 C-30 320, 25 320, 30 340 L35 560 C35 575, -35 575, -35 560 Z" fill="url(#shirtGrad)"/>
    <ellipse cx="-2" cy="340" rx="30" ry="12" fill="#245550"/>

