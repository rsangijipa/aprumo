    <ellipse cx="0" cy="790" rx="110" ry="24" fill="url(#leoFloorShadow)"/>

    <!-- Left Leg (Background) -->
    <rect x="-18" y="550" width="36" height="200" rx="14" fill="url(#pantsGrad)"/>
    <!-- Left Shoe -->
