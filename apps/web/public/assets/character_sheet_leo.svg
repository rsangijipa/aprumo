    <!-- Eye Side -->
    <ellipse cx="22" cy="228" rx="4" ry="6" fill="#263238"/>
    <!-- Eyebrow -->
    <path d="M16 218 Q23 214 28 218" stroke="#4E3127" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Smile profile -->
    <path d="M22 264 Q28 266 32 260" stroke="#B03A2E" stroke-width="3" fill="none" stroke-linecap="round"/>

