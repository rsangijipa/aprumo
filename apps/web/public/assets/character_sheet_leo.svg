  <!-- Technical Spec Footer -->
  <g transform="translate(80, 940)">
    <rect width="1376" height="50" rx="10" fill="#FFFFFF" stroke="#CFD8DC"/>
    <text x="24" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#455A64">
      📐 Especificação Técnica: Paleta HSL Suave • Altura Proporcional 7a (120cm canônico) • Vetor Escalável SVG • 1536×1024 • Licença MIT (Aprumo Core)
    </text>
  </g>
</svg>
