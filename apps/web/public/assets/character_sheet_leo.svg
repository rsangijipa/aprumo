    <circle cx="-52" cy="236" r="12" fill="url(#skinGrad)"/>
    <circle cx="52" cy="236" r="12" fill="url(#skinGrad)"/>

    <!-- Hair Front -->
    <path d="M-54 220 C-56 160, 56 160, 54 220 C42 185, 10 178, -12 188 C-25 195, -45 198, -54 220 Z" fill="url(#hairGrad)"/>
