    <ellipse cx="-20" cy="232" rx="5.5" ry="7.5" fill="#263238"/>
    <circle cx="-18" cy="229" r="2.2" fill="#FFFFFF"/>
    <ellipse cx="20" cy="232" rx="5.5" ry="7.5" fill="#263238"/>
    <circle cx="22" cy="229" r="2.2" fill="#FFFFFF"/>

