<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="Social Story Character Sheet: Leo">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="70%" stop-color="#E2E7EA"/>
      <stop offset="100%" stop-color="#D5DDE1"/>
    </linearGradient>

    <!-- Floor Shadow Gradient -->
    <radialGradient id="leoFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(33,52,50,0.22)"/>
      <stop offset="60%" stop-color="rgba(33,52,50,0.08)"/>
      <stop offset="100%" stop-color="rgba(33,52,50,0)"/>
    </radialGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FFDFBA"/>
      <stop offset="50%" stop-color="#F5CBA7"/>
      <stop offset="100%" stop-color="#E59866"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6E473B"/>
      <stop offset="60%" stop-color="#4E3127"/>
      <stop offset="100%" stop-color="#2D1C16"/>
    </linearGradient>

    <!-- T-Shirt Teal Gradient -->
    <linearGradient id="shirtGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6BB5AD"/>
      <stop offset="45%" stop-color="#3F857D"/>
      <stop offset="100%" stop-color="#245550"/>
    </linearGradient>

    <!-- Khaki Trousers Gradient -->
    <linearGradient id="pantsGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="50%" stop-color="#BCAAA4"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>

    <!-- Sneaker Navy Gradient -->
    <linearGradient id="shoesGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="60%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>

    <!-- Subtle Rim Light -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="1536" height="1024" fill="url(#bgGrad)"/>
  <line x1="0" y1="780" x2="1536" y2="780" stroke="rgba(200,210,216,0.6)" stroke-width="2"/>

  <!-- Studio Header -->
  <g transform="translate(80, 70)">
