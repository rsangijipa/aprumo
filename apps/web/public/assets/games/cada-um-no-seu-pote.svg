<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
      <linearGradient id="pot1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="100%" stop-color="#0369a1" />
      </linearGradient>
      <linearGradient id="pot2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c" />
        <stop offset="100%" stop-color="#c2410c" />
      </linearGradient>
      <linearGradient id="pot3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c084fc" />
        <stop offset="100%" stop-color="#6d28d9" />
      </linearGradient>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Mesa / Superfície de madeira aquecida -->
      <path d="M0,230 Q320,215 640,230 L640,360 L0,360 Z" fill="url(#tableGrad)" />
      <ellipse cx="320" cy="225" rx="280" ry="12" fill="#000000" opacity="0.18" />

      <!-- Pote 1: Turquesa / Frutas Azuis/Verdes -->
      <g filter="url(#dropShadow)">
        <ellipse cx="170" cy="255" rx="42" ry="10" fill="#000000" opacity="0.25" />
        <path d="M135,160 C130,220 140,250 170,250 C200,250 210,220 205,160 Z" fill="url(#pot1Grad)" stroke="#38bdf8" stroke-width="2.5" />
        <ellipse cx="170" cy="160" rx="35" ry="11" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
        <ellipse cx="170" cy="160" rx="27" ry="8" fill="#0369a1" />
        <!-- Brilho 3D no Pote 1 -->
        <path d="M145,175 Q140,215 155,235" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
        <!-- Pote 1 Conteúdo / Pimentões ou Botões Verdes -->
        <circle cx="165" cy="145" r="14" fill="#22c55e" stroke="#15803d" stroke-width="2" />
        <circle cx="162" cy="142" r="3.5" fill="#ffffff" opacity="0.7" />
        <circle cx="182" cy="150" r="12" fill="#4ade80" stroke="#16a34a" stroke-width="2" />
      </g>

      <!-- Pote 2 (Central): Laranja / Frutas e Estrelas Douradas -->
      <g filter="url(#dropShadow)">
        <ellipse cx="320" cy="265" rx="50" ry="12" fill="#000000" opacity="0.3" />
        <path d="M280,145 C272,225 285,260 320,260 C355,260 368,225 360,145 Z" fill="url(#pot2Grad)" stroke="#fbbf24" stroke-width="3" />
        <ellipse cx="320" cy="145" rx="40" ry="13" fill="#ea580c" stroke="#fed7aa" stroke-width="2" />
        <ellipse cx="320" cy="145" rx="31" ry="9" fill="#9a3412" />
        <!-- Brilho no Pote Central -->
        <path d="M292,165 Q286,220 304,245" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
        <!-- Item saltando: Laranja com carinha sorridente -->
        <circle cx="320" cy="120" r="22" fill="#f97316" stroke="#c2410c" stroke-width="2.5" />
        <circle cx="314" cy="114" r="5" fill="#ffffff" opacity="0.75" />
        <path d="M312,126 Q320,133 328,126" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <!-- Folhinha verde -->
        <path d="M320,98 Q332,92 330,105 Q322,106 320,98 Z" fill="#22c55e" />
      </g>

      <!-- Pote 3: Púrpura / Gemas e Frutas Roxas -->
      <g filter="url(#dropShadow)">
        <ellipse cx="470" cy="255" rx="42" ry="10" fill="#000000" opacity="0.25" />
        <path d="M435,160 C430,220 440,250 470,250 C500,250 510,220 505,160 Z" fill="url(#pot3Grad)" stroke="#c084fc" stroke-width="2.5" />
        <ellipse cx="470" cy="160" rx="35" ry="11" fill="#7c3aed" stroke="#ddd6fe" stroke-width="2" />
        <ellipse cx="470" cy="160" rx="27" ry="8" fill="#5b21b6" />
        <!-- Brilho no Pote 3 -->
        <path d="M445,175 Q440,215 455,235" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
        <!-- Frutinha / Uva caindo -->
        <circle cx="468" cy="142" r="14" fill="#a855f7" stroke="#6b21a8" stroke-width="2" />
        <circle cx="464" cy="139" r="3.5" fill="#ffffff" opacity="0.7" />
        <circle cx="484" cy="148" r="12" fill="#c084fc" stroke="#7e22ce" stroke-width="2" />
      </g>

      <!-- Partículas de celebração no ar -->
      <circle cx="210" cy="100" r="4" fill="#fde047" opacity="0.8" />
      <circle cx="410" cy="95" r="5" fill="#38bdf8" opacity="0.8" />
      <path d="M260,85 L263,93 L271,95 L264,100 L266,108 L260,103 L254,108 L256,100 L249,95 L257,93 Z" fill="#fbbf24" opacity="0.85" />
      <path d="M380,80 L382,86 L388,88 L383,92 L384,98 L380,94 L376,98 L377,92 L372,88 L378,86 Z" fill="#f43f5e" opacity="0.85" />
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Cada Um no Seu Pote</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">CLASSIFICAÇÃO MULTICRITÉRIO</text>
  </g>
</svg>
