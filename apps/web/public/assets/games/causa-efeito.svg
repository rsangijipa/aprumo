<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="magicBeam" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="btnDomeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fb7185" />
        <stop offset="60%" stop-color="#e11d48" />
        <stop offset="100%" stop-color="#9f1239" />
      </linearGradient>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Plataforma tecnológica com luzes neon circulares -->
      <ellipse cx="320" cy="270" rx="220" ry="40" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" opacity="0.6" />
      <ellipse cx="320" cy="270" rx="170" ry="30" fill="#312e81" stroke="#a5b4fc" stroke-width="2" opacity="0.8" />

      <!-- Feixes de luz ascendentes mágicos -->
      <path d="M260,250 L200,60 L440,60 L380,250 Z" fill="url(#magicBeam)" opacity="0.45" />

      <!-- Botão gigante 3D (Push Button com efeito tátil) -->
      <g filter="url(#dropShadow)">
        <!-- Base do botão -->
        <ellipse cx="320" cy="245" rx="110" ry="32" fill="#1e293b" stroke="#475569" stroke-width="4" />
        <path d="M210,245 L210,225 C210,205 430,205 430,225 L430,245 Z" fill="#334155" />
        <ellipse cx="320" cy="225" rx="110" ry="32" fill="#475569" />

        <!-- Cúpula do botão vermelho vivo iluminado -->
        <path d="M230,215 C230,140 410,140 410,215 Z" fill="url(#btnDomeGrad)" stroke="#f43f5e" stroke-width="4" />
        <ellipse cx="320" cy="215" rx="90" ry="26" fill="#e11d48" />

        <!-- Brilho curvo 3D da cúpula -->
        <path d="M260,175 Q320,150 375,172" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75" />
        <ellipse cx="280" cy="180" rx="16" ry="7" fill="#ffffff" opacity="0.6" />

        <!-- Ícone luminoso no centro do botão -->
        <path d="M312,192 L328,172 L320,172 L326,155 L310,175 L318,175 Z" fill="#ffffff" filter="url(#glowFilter)" />
      </g>

      <!-- Efeitos de faíscas e estrelas voando ao redor -->
      <g>
        <circle cx="190" cy="140" r="16" fill="#facc15" opacity="0.9" />
        <circle cx="186" cy="136" r="4" fill="#ffffff" />
        <circle cx="450" cy="150" r="14" fill="#38bdf8" opacity="0.9" />
        <circle cx="447" cy="146" r="3.5" fill="#ffffff" />
        <path d="M220,100 L224,112 L236,116 L226,124 L228,136 L220,128 L212,136 L214,124 L204,116 L216,112 Z" fill="#ec4899" />
        <path d="M420,105 L423,114 L432,117 L425,123 L427,132 L420,126 L413,132 L415,123 L408,117 L417,114 Z" fill="#facc15" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Botão Mágico</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">CAUSA E EFEITO LÚDICO</text>
  </g>
</svg>
