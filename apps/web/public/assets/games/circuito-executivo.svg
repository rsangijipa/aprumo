<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Pista sinuosa / Labirinto divertido com perspectiva -->
      <path d="M80,310 C180,290 200,210 270,220 C350,230 360,160 440,150 C520,140 560,90 580,70" stroke="#fde047" stroke-width="52" stroke-linecap="round" fill="none" opacity="0.3" />
      <path d="M80,310 C180,290 200,210 270,220 C350,230 360,160 440,150 C520,140 560,90 580,70" stroke="#f8fafc" stroke-width="44" stroke-linecap="round" fill="none" filter="url(#dropShadow)" />
      <!-- Faixa central tracejada da pista -->
      <path d="M80,310 C180,290 200,210 270,220 C350,230 360,160 440,150 C520,140 560,90 580,70" stroke="#f97316" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round" fill="none" />

      <!-- Estação 1: Cone / Obstáculo Laranja -->
      <g filter="url(#dropShadow)" transform="translate(160, 240)">
        <ellipse cx="25" cy="45" rx="28" ry="8" fill="#000000" opacity="0.25" />
        <path d="M5,42 L25,5 L45,42 Z" fill="#ea580c" stroke="#fed7aa" stroke-width="2" />
        <path d="M12,28 L38,28 L33,18 L17,18 Z" fill="#ffffff" />
      </g>

      <!-- Estação 2: Alvo Circular com Estrela Central -->
      <g filter="url(#dropShadow)" transform="translate(260, 150)">
        <circle cx="40" cy="40" r="32" fill="#3b82f6" stroke="#ffffff" stroke-width="4" />
        <circle cx="40" cy="40" r="22" fill="#60a5fa" />
        <circle cx="40" cy="40" r="12" fill="#ffffff" />
        <circle cx="36" cy="36" r="3" fill="#1d4ed8" />
      </g>

      <!-- Estação 3: Troféu / Bandeira de Chegada -->
      <g filter="url(#dropShadow)" transform="translate(420, 80)">
        <!-- Mastro -->
        <rect x="38" y="20" width="6" height="85" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
        <!-- Bandeira quadriculada estilizada -->
        <path d="M44,22 L100,22 C95,35 105,48 100,60 L44,60 Z" fill="#0284c7" stroke="#ffffff" stroke-width="2.5" />
        <circle cx="72" cy="41" r="12" fill="#facc15" />
        <path d="M72,33 L75,39 L81,40 L76,44 L78,50 L72,46 L66,50 L68,44 L63,40 L69,39 Z" fill="#ffffff" />
      </g>

      <!-- Personagem / Peão saltitante na pista -->
      <g filter="url(#dropShadow)" transform="translate(195, 180)">
        <ellipse cx="25" cy="50" rx="18" ry="6" fill="#000000" opacity="0.3" />
        <circle cx="25" cy="22" r="20" fill="#f43f5e" stroke="#ffffff" stroke-width="3" />
        <circle cx="20" cy="16" r="5" fill="#ffffff" opacity="0.8" />
        <!-- Olhinhos alegres -->
        <circle cx="20" cy="22" r="3" fill="#881337" />
        <circle cx="30" cy="22" r="3" fill="#881337" />
        <path d="M22,28 Q25,32 28,28" stroke="#881337" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Circuito Divertido</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">FUNÇÃO EXECUTIVA & DESAFIO</text>
  </g>
</svg>
