<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
      </linearGradient>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Palco aconchegante com cortinas teatrais no topo -->
      <path d="M0,0 L0,70 Q80,90 160,70 Q240,90 320,70 Q400,90 480,70 Q560,90 640,70 L640,0 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="2" />
      <path d="M0,0 L0,60 Q80,80 160,60 Q240,80 320,60 Q400,80 480,60 Q560,80 640,60 L640,0 Z" fill="#b91c1c" />

      <!-- Feixe de luz de holofote sobre o objeto central -->
      <path d="M320,20 L160,330 L480,330 Z" fill="url(#spotlight)" opacity="0.35" />

      <!-- Alto-falante / Megafone de ouro transmitindo som claro -->
      <g filter="url(#dropShadow)" transform="translate(90, 110)">
        <ellipse cx="30" cy="55" rx="20" ry="6" fill="#000000" opacity="0.3" />
        <!-- Corpo do megafone -->
        <path d="M20,35 L60,15 L60,65 L20,45 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
        <ellipse cx="60" cy="40" rx="6" ry="25" fill="#fef08a" stroke="#d97706" stroke-width="2" />
        <rect x="5" y="32" width="16" height="16" rx="3" fill="#b45309" />
        <!-- Ondas sonoras douradas -->
        <path d="M75,25 Q90,40 75,55" stroke="#fde047" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <path d="M85,15 Q105,40 85,65" stroke="#fde047" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75" />
      </g>

      <!-- Prateleira / Estante com opções para tocar -->
      <g filter="url(#dropShadow)">
        <rect x="180" y="240" width="280" height="22" rx="8" fill="#d97706" stroke="#b45309" stroke-width="2" />
        <path d="M190,262 L450,262 L430,272 L210,272 Z" fill="#92400e" />

        <!-- Opção 1: Bola de praia colorida -->
        <g transform="translate(210, 175)">
          <circle cx="30" cy="30" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
          <path d="M30,2 C45,2 54,15 54,30 C54,45 45,58 30,58 Z" fill="#3b82f6" />
          <path d="M30,2 C38,2 44,15 44,30 C44,45 38,58 30,58 Z" fill="#facc15" />
          <circle cx="22" cy="20" r="5" fill="#ffffff" opacity="0.6" />
        </g>

        <!-- Opção 2 (O Alvo com brilho verde): Maçã Suculenta -->
        <g transform="translate(320, 170)">
          <!-- Círculo de seleção tátil pulsante -->
          <circle cx="35" cy="35" r="42" fill="#22c55e" opacity="0.25" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 4" />
          <circle cx="35" cy="38" r="28" fill="#dc2626" stroke="#ffffff" stroke-width="3" />
          <circle cx="26" cy="28" r="5" fill="#ffffff" opacity="0.75" />
          <!-- Cabinho e folhinha -->
          <path d="M35,10 Q37,2 42,2" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
          <path d="M36,6 Q48,2 46,12 Z" fill="#22c55e" />
        </g>

        <!-- Mãozinha tátil tocando a maçã -->
        <g transform="translate(365, 205)" filter="url(#dropShadow)">
          <path d="M10,25 L10,5 C10,2 14,2 14,5 L14,20 L18,12 C20,10 23,12 22,15 L18,28 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
        </g>
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Escute e Toque</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">DISCRIMINAÇÃO AUDITIVA ABA</text>
  </g>
</svg>
