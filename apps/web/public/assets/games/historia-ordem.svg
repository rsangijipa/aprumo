<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Trilho de sequência com números 1, 2, 3 interligados -->
      <path d="M120,190 L520,190" stroke="#facc15" stroke-width="8" stroke-dasharray="16 10" stroke-linecap="round" />

      <!-- Cartão 1: Acordar / Sol nascendo -->
      <g filter="url(#dropShadow)" transform="translate(80, 95)">
        <rect x="0" y="0" width="135" height="170" rx="18" fill="#ffffff" stroke="#38bdf8" stroke-width="3" />
        <rect x="8" y="8" width="119" height="115" rx="12" fill="#e0f2fe" />
        <!-- Ilustração interna: Sol sorridente e galo -->
        <circle cx="67" cy="65" r="28" fill="#facc15" stroke="#eab308" stroke-width="2.5" />
        <circle cx="60" cy="58" r="3" fill="#713f12" />
        <circle cx="74" cy="58" r="3" fill="#713f12" />
        <path d="M62,68 Q67,73 72,68" stroke="#713f12" stroke-width="2" fill="none" stroke-linecap="round" />
        <!-- Número 1 grande -->
        <circle cx="67" cy="144" r="15" fill="#0284c7" />
        <text x="67" y="151" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">1</text>
      </g>

      <!-- Cartão 2: Café da manhã / Maçã e suco -->
      <g filter="url(#dropShadow)" transform="translate(252, 95)">
        <rect x="0" y="0" width="135" height="170" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="3" />
        <rect x="8" y="8" width="119" height="115" rx="12" fill="#ffedd5" />
        <!-- Ilustração interna: Tigela com colher e fruta -->
        <ellipse cx="67" cy="80" rx="35" ry="18" fill="#f97316" />
        <ellipse cx="67" cy="74" rx="32" ry="14" fill="#fed7aa" />
        <path d="M55,50 L75,75" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
        <!-- Número 2 grande -->
        <circle cx="67" cy="144" r="15" fill="#ea580c" />
        <text x="67" y="151" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">2</text>
      </g>

      <!-- Cartão 3: Mochilinha pronta para ir brincar/escola -->
      <g filter="url(#dropShadow)" transform="translate(425, 95)">
        <rect x="0" y="0" width="135" height="170" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="3" />
        <rect x="8" y="8" width="119" height="115" rx="12" fill="#dcfce7" />
        <!-- Ilustração interna: Mochila fofa com bolsinho -->
        <rect x="37" y="38" width="60" height="65" rx="16" fill="#16a34a" stroke="#15803d" stroke-width="2" />
        <rect x="47" y="65" width="40" height="28" rx="8" fill="#4ade80" />
        <path d="M50,38 Q67,20 84,38" stroke="#15803d" stroke-width="4" fill="none" />
        <!-- Número 3 grande -->
        <circle cx="67" cy="144" r="15" fill="#16a34a" />
        <text x="67" y="151" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">3</text>
      </g>

      <!-- Setas conectoras animadas entre os passos -->
      <path d="M222,180 L242,180" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
      <path d="M395,180 L415,180" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">História em Ordem</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">SEQUENCIAMENTO TEMPORAL & TEACCH</text>
  </g>
</svg>
