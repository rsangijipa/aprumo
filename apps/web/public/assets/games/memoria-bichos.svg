<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#4ade80" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Mesa de madeira com textura suave -->
      <rect x="40" y="50" width="560" height="260" rx="28" fill="#78350f" opacity="0.35" />

      <!-- Par 1: Leãozinho fofo (carta aberta) -->
      <g filter="url(#dropShadow)" transform="translate(100, 80)">
        <rect x="0" y="0" width="115" height="150" rx="18" fill="#ffffff" stroke="#fde047" stroke-width="4" />
        <rect x="8" y="8" width="99" height="134" rx="12" fill="#fef9c3" />
        <!-- Juba de leão -->
        <circle cx="57" cy="72" r="38" fill="#ea580c" />
        <!-- Rosto do leão -->
        <circle cx="57" cy="72" r="26" fill="#fde047" />
        <circle cx="48" cy="68" r="3.5" fill="#1e293b" />
        <circle cx="66" cy="68" r="3.5" fill="#1e293b" />
        <ellipse cx="57" cy="75" rx="5" ry="3.5" fill="#ea580c" />
        <path d="M52,80 Q57,85 62,80" stroke="#713f12" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>

      <!-- Par 1 (Segundo Leãozinho encontrado - combinação perfeita com estrelinhas) -->
      <g filter="url(#dropShadow)" transform="translate(230, 80)">
        <rect x="0" y="0" width="115" height="150" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="4" />
        <rect x="8" y="8" width="99" height="134" rx="12" fill="#fef9c3" />
        <circle cx="57" cy="72" r="38" fill="#ea580c" />
        <circle cx="57" cy="72" r="26" fill="#fde047" />
        <circle cx="48" cy="68" r="3.5" fill="#1e293b" />
        <circle cx="66" cy="68" r="3.5" fill="#1e293b" />
        <ellipse cx="57" cy="75" rx="5" ry="3.5" fill="#ea580c" />
        <!-- Borda brilhante verde de acerto -->
        <rect x="2" y="2" width="111" height="146" rx="16" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 6" />
      </g>

      <!-- Carta 3: Verso decorado da carta (com padrão de pata de animal) -->
      <g filter="url(#dropShadow)" transform="translate(360, 80)">
        <rect x="0" y="0" width="115" height="150" rx="18" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
        <rect x="6" y="6" width="103" height="138" rx="12" fill="#2563eb" />
        <!-- Pata de bicho estilizada no verso -->
        <ellipse cx="57" cy="82" rx="18" ry="14" fill="#ffffff" opacity="0.9" />
        <circle cx="40" cy="62" r="6" fill="#ffffff" opacity="0.9" />
        <circle cx="51" cy="55" r="6" fill="#ffffff" opacity="0.9" />
        <circle cx="63" cy="55" r="6" fill="#ffffff" opacity="0.9" />
        <circle cx="74" cy="62" r="6" fill="#ffffff" opacity="0.9" />
      </g>

      <!-- Carta 4: Ursinho fofo -->
      <g filter="url(#dropShadow)" transform="translate(490, 80)">
        <rect x="0" y="0" width="115" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
        <rect x="8" y="8" width="99" height="134" rx="12" fill="#f1f5f9" />
        <!-- Ursinho marrom carismático -->
        <circle cx="38" cy="55" r="12" fill="#78350f" />
        <circle cx="76" cy="55" r="12" fill="#78350f" />
        <circle cx="57" cy="75" r="32" fill="#92400e" />
        <ellipse cx="57" cy="85" rx="16" ry="12" fill="#fde68a" />
        <circle cx="57" cy="80" r="5" fill="#451a03" />
        <circle cx="48" cy="70" r="3" fill="#ffffff" />
        <circle cx="66" cy="70" r="3" fill="#ffffff" />
      </g>

      <!-- Estrelinhas e confetes de vitória -->
      <circle cx="345" cy="55" r="6" fill="#facc15" />
      <circle cx="215" cy="60" r="5" fill="#4ade80" />
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Memória dos Bichos</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">MEMÓRIA VISUAL & CONCENTRAÇÃO</text>
  </g>
</svg>
