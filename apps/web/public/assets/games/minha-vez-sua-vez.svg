<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Ampulheta gigante central com areia dourada escorrendo -->
      <g filter="url(#dropShadow)" transform="translate(265, 75)">
        <!-- Suporte da ampulheta de madeira -->
        <rect x="10" y="0" width="90" height="12" rx="6" fill="#b45309" stroke="#fde68a" stroke-width="2" />
        <rect x="10" y="160" width="90" height="12" rx="6" fill="#b45309" stroke="#fde68a" stroke-width="2" />
        <line x1="20" y1="12" x2="20" y2="160" stroke="#d97706" stroke-width="4" />
        <line x1="90" y1="12" x2="90" y2="160" stroke="#d97706" stroke-width="4" />

        <!-- Vidro da ampulheta -->
        <path d="M22,12 C22,65 50,86 55,86 C60,86 88,65 88,12 Z" fill="#e0f2fe" opacity="0.6" stroke="#ffffff" stroke-width="2" />
        <path d="M22,160 C22,107 50,86 55,86 C60,86 88,107 88,160 Z" fill="#e0f2fe" opacity="0.6" stroke="#ffffff" stroke-width="2" />

        <!-- Areia dourada caindo -->
        <path d="M30,35 C30,70 50,82 55,86 C60,82 80,70 80,35 Z" fill="#facc15" />
        <line x1="55" y1="86" x2="55" y2="145" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
        <ellipse cx="55" cy="148" rx="25" ry="10" fill="#facc15" />
      </g>

      <!-- Cartão "Minha Vez" (Criança Azul - Ativo) -->
      <g filter="url(#dropShadow)" transform="translate(70, 110)">
        <rect x="0" y="0" width="165" height="135" rx="20" fill="#ffffff" stroke="#3b82f6" stroke-width="4" />
        <!-- Avatar Menino Azul Feliz -->
        <circle cx="82" cy="50" r="30" fill="#60a5fa" />
        <circle cx="82" cy="48" r="24" fill="#fed7aa" />
        <circle cx="75" cy="45" r="3" fill="#1e3a8a" />
        <circle cx="89" cy="45" r="3" fill="#1e3a8a" />
        <path d="M78,54 Q82,60 86,54" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" fill="none" />
        <!-- Badge Minha Vez -->
        <rect x="25" y="92" width="115" height="28" rx="14" fill="#3b82f6" />
        <text x="82" y="111" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">MINHA VEZ</text>
      </g>

      <!-- Cartão "Sua Vez" (Amigo Laranja - Esperando com sorriso calmo) -->
      <g filter="url(#dropShadow)" transform="translate(405, 110)">
        <rect x="0" y="0" width="165" height="135" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" opacity="0.9" />
        <!-- Avatar Menina Laranja Amiga -->
        <circle cx="82" cy="50" r="30" fill="#f97316" />
        <circle cx="82" cy="48" r="24" fill="#fed7aa" />
        <circle cx="75" cy="45" r="3" fill="#7c2d12" />
        <circle cx="89" cy="45" r="3" fill="#7c2d12" />
        <path d="M78,54 Q82,59 86,54" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none" />
        <!-- Badge Esperando com calma -->
        <rect x="25" y="92" width="115" height="28" rx="14" fill="#cbd5e1" />
        <text x="82" y="111" fill="#475569" font-size="13" font-weight="800" text-anchor="middle">ESPERANDO</text>
      </g>

      <!-- Brinquedo compartilhado no meio sendo passado com carinho -->
      <g filter="url(#dropShadow)" transform="translate(295, 235)">
        <circle cx="25" cy="25" r="22" fill="#ec4899" stroke="#ffffff" stroke-width="2.5" />
        <circle cx="18" cy="18" r="6" fill="#f472b6" />
        <!-- Carinha sorridente no brinquedo -->
        <path d="M19,28 Q25,34 31,28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Minha Vez, Sua Vez</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">ALTERNÂNCIA DE TURNOS & ESPERA</text>
  </g>
</svg>
