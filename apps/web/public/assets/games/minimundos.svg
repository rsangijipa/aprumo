<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Colina verdejante e estrada em curva -->
      <path d="M0,220 Q320,180 640,240 L640,360 L0,360 Z" fill="#10b981" />
      <path d="M50,330 C200,300 240,240 380,250 C460,260 540,210 600,190" stroke="#fde047" stroke-width="40" stroke-linecap="round" fill="none" opacity="0.3" />
      <path d="M50,330 C200,300 240,240 380,250 C460,260 540,210 600,190" stroke="#64748b" stroke-width="32" stroke-linecap="round" fill="none" />
      <path d="M50,330 C200,300 240,240 380,250 C460,260 540,210 600,190" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" fill="none" />

      <!-- Casinha de brinquedo charmosa no morro -->
      <g filter="url(#dropShadow)" transform="translate(130, 110)">
        <!-- Parede amarela -->
        <rect x="20" y="50" width="90" height="70" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
        <!-- Telhado vermelho inclinado -->
        <polygon points="10,55 65,10 120,55" fill="#ef4444" stroke="#b91c1c" stroke-width="2.5" />
        <!-- Porta azul -->
        <rect x="52" y="80" width="26" height="40" rx="6" fill="#3b82f6" />
        <circle cx="72" cy="100" r="2.5" fill="#ffffff" />
        <!-- Janela redonda no sótão -->
        <circle cx="65" cy="38" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
        <line x1="55" y1="38" x2="75" y2="38" stroke="#94a3b8" stroke-width="1.5" />
        <line x1="65" y1="28" x2="65" y2="48" stroke="#94a3b8" stroke-width="1.5" />
      </g>

      <!-- Árvores arredondadas fofas (estilo massinha) -->
      <g filter="url(#dropShadow)" transform="translate(80, 160)">
        <rect x="22" y="45" width="10" height="30" rx="4" fill="#78350f" />
        <circle cx="27" cy="35" r="28" fill="#22c55e" stroke="#15803d" stroke-width="2" />
        <circle cx="20" cy="25" r="7" fill="#86efac" />
      </g>
      <g filter="url(#dropShadow)" transform="translate(480, 130)">
        <rect x="22" y="55" width="10" height="35" rx="4" fill="#78350f" />
        <circle cx="27" cy="40" r="32" fill="#16a34a" stroke="#14532d" stroke-width="2" />
        <circle cx="20" cy="28" r="8" fill="#86efac" />
      </g>

      <!-- Carrinho de brinquedo azul andando na estradinha -->
      <g filter="url(#dropShadow)" transform="translate(280, 205)">
        <!-- Rodas pretas -->
        <circle cx="25" cy="50" r="12" fill="#1e293b" stroke="#64748b" stroke-width="2" />
        <circle cx="75" cy="50" r="12" fill="#1e293b" stroke="#64748b" stroke-width="2" />
        <!-- Chassi azul do carro -->
        <path d="M10,48 C10,35 25,30 35,30 L45,15 C48,10 70,10 75,15 L85,30 C95,30 100,38 100,48 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />
        <!-- Janelinhas do carro -->
        <polygon points="46,18 70,18 68,28 42,28" fill="#e0f2fe" />
        <!-- Farol aceso brilhante -->
        <circle cx="98" cy="38" r="5" fill="#facc15" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">MiniMundos</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">BRINCAR SIMBÓLICO & NARRATIVA</text>
  </g>
</svg>
