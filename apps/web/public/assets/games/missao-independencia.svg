<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Banheiro / Quarto reluzente com bolhas de sabão flutuantes -->
      <circle cx="120" cy="90" r="22" fill="#ffffff" opacity="0.25" stroke="#bae6fd" stroke-width="2" />
      <circle cx="114" cy="84" r="5" fill="#ffffff" opacity="0.8" />
      <circle cx="530" cy="110" r="28" fill="#ffffff" opacity="0.2" stroke="#bae6fd" stroke-width="2" />
      <circle cx="522" cy="102" r="7" fill="#ffffff" opacity="0.8" />

      <!-- Escova de dente de super-herói com capa e pasta cintilante -->
      <g filter="url(#dropShadow)" transform="translate(200, 90)">
        <!-- Cabo da escova ergonômico azul e verde -->
        <rect x="90" y="30" width="22" height="150" rx="11" fill="#3b82f6" stroke="#ffffff" stroke-width="3" transform="rotate(-30, 90, 30)" />
        <rect x="88" y="70" width="12" height="50" rx="6" fill="#22c55e" transform="rotate(-30, 90, 30)" />
        <!-- Cerdas da escova -->
        <rect x="25" y="10" width="35" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="2" transform="rotate(-30, 25, 10)" />
        <!-- Pasta de dente brilhante com estrelinhas -->
        <path d="M22,12 Q38,-5 55,8 Q42,16 22,12 Z" fill="#ec4899" stroke="#ffffff" stroke-width="2" />
        <circle cx="36" cy="6" r="2" fill="#ffffff" />
      </g>

      <!-- Sabonete sorridente com bolhas de espuma -->
      <g filter="url(#dropShadow)" transform="translate(340, 150)">
        <rect x="0" y="0" width="105" height="65" rx="24" fill="#f472b6" stroke="#ffffff" stroke-width="3" />
        <circle cx="20" cy="15" r="7" fill="#ffffff" opacity="0.6" />
        <!-- Carinha feliz no sabonete -->
        <circle cx="42" cy="32" r="4" fill="#831843" />
        <circle cx="68" cy="32" r="4" fill="#831843" />
        <path d="M48,42 Q55,50 62,42" stroke="#831843" stroke-width="3" stroke-linecap="round" fill="none" />
      </g>

      <!-- Toalhinha felpuda amarela dobrada -->
      <g filter="url(#dropShadow)" transform="translate(100, 180)">
        <rect x="0" y="0" width="90" height="50" rx="14" fill="#facc15" stroke="#eab308" stroke-width="2.5" />
        <line x1="10" y1="25" x2="80" y2="25" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4" />
      </g>

      <!-- Emblema de Super-Conquista (Medalha de Independência) -->
      <g filter="url(#dropShadow)" transform="translate(450, 70)">
        <circle cx="40" cy="40" r="34" fill="#f59e0b" stroke="#fef08a" stroke-width="4" />
        <path d="M40,20 L45,32 L58,34 L48,44 L51,57 L40,50 L29,57 L32,44 L22,34 L35,32 Z" fill="#ffffff" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Missão Independência</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">AUTONOMIA & HÁBITOS DIÁRIOS</text>
  </g>
</svg>
