    </filter>
  </defs>
  <rect width="640" height="360" rx="24" fill="url(#grad)"/>
  <rect width="640" height="360" rx="24" fill="url(#glow)"/>
  <circle cx="80" cy="70" r="45" fill="#ffffff" opacity="0.1"/>
  <circle cx="570" cy="280" r="70" fill="#ffffff" opacity="0.08"/>
  <circle cx="540" cy="80" r="35" fill="#ffffff" opacity="0.12"/>
  <g id="hero-art">
    <rect x="260" y="105" width="120" height="90" rx="14" fill="#34d399" filter="url(#shadow)"/><rect x="295" y="88" width="50" height="20" rx="6" fill="#f59e0b"/><line x1="260" y1="145" x2="380" y2="145" stroke="#065f46" stroke-width="4"/><circle cx="320" cy="145" r="12" fill="#fbbf24"/>
  </g>
  <rect x="60" y="260" width="520" height="68" rx="16" fill="#000000" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <text x="320" y="292" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Missão Independência</text>
  <text x="320" y="313" text-anchor="middle" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.05em">AUTONOMIA & VIDA REAL</text>
</svg>