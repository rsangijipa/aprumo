<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="50%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Peças de quebra-cabeça que se encaixam com carinho -->
      <!-- Peça 1: Meia quentinha -->
      <g filter="url(#dropShadow)" transform="translate(130, 95)">
        <rect x="0" y="0" width="160" height="160" rx="22" fill="#ffffff" stroke="#f472b6" stroke-width="3" />
        <!-- Encaixe de puzzle à direita -->
        <circle cx="160" cy="80" r="22" fill="#ffffff" stroke="#f472b6" stroke-width="3" />
        <rect x="156" y="60" width="6" height="40" fill="#ffffff" />
        <!-- Meia listrada linda -->
        <g transform="translate(45, 30)">
          <path d="M25,10 L55,10 L55,55 L80,75 C85,85 75,95 60,95 L35,80 L25,50 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3" />
          <path d="M25,25 L55,25" stroke="#ffffff" stroke-width="4" />
          <path d="M25,40 L55,40" stroke="#facc15" stroke-width="4" />
        </g>
      </g>

      <!-- Peça 2: Tênis esportivo combinando -->
      <g filter="url(#dropShadow)" transform="translate(325, 95)">
        <rect x="0" y="0" width="160" height="160" rx="22" fill="#ffffff" stroke="#38bdf8" stroke-width="3" />
        <!-- Encaixe interno correspondente à esquerda -->
        <circle cx="0" cy="80" r="20" fill="#db2777" />
        <!-- Tênis esportivo -->
        <g transform="translate(25, 45)">
          <path d="M10,50 L25,25 C35,25 45,35 60,35 L90,40 C105,45 105,65 95,70 L10,70 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3" />
          <rect x="10" y="65" width="95" height="12" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
          <!-- Cadarço amarelo -->
          <line x1="38" y1="33" x2="48" y2="43" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
          <line x1="48" y1="33" x2="58" y2="43" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
        </g>
      </g>

      <!-- Corações de amor e conexão unindo os dois itens -->
      <g fill="#fde047" filter="url(#dropShadow)">
        <path d="M310,80 C310,65 325,65 325,75 C325,65 340,65 340,75 C340,90 325,100 325,100 C325,100 310,90 310,80 Z" transform="translate(0, -10)" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Par Perfeito</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">PAREAMENTO POR ASSOCIAÇÃO</text>
  </g>
</svg>
