<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Prancheta organizada de tarefas com checkmarks verdes reluzentes -->
      <g filter="url(#dropShadow)" transform="translate(180, 50)">
        <!-- Prancheta de madeira -->
        <rect x="0" y="0" width="280" height="250" rx="24" fill="#d97706" stroke="#b45309" stroke-width="3" />
        <!-- Clipe metálico superior -->
        <rect x="90" y="-12" width="100" height="24" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="2" />
        <circle cx="140" cy="0" r="5" fill="#475569" />

        <!-- Folha de papel branca com cantos arredondados -->
        <rect x="15" y="20" width="250" height="215" rx="16" fill="#ffffff" />

        <!-- Passo 1: Concluído (com tique verde brilhante) -->
        <g transform="translate(35, 45)">
          <circle cx="16" cy="16" r="14" fill="#22c55e" />
          <path d="M10,16 L15,21 L23,11" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <rect x="42" y="8" width="140" height="16" rx="6" fill="#e2e8f0" />
        </g>

        <!-- Passo 2: Concluído -->
        <g transform="translate(35, 95)">
          <circle cx="16" cy="16" r="14" fill="#22c55e" />
          <path d="M10,16 L15,21 L23,11" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <rect x="42" y="8" width="120" height="16" rx="6" fill="#e2e8f0" />
        </g>

        <!-- Passo 3: Em andamento / Atual (com destaque azul) -->
        <g transform="translate(35, 145)">
          <circle cx="16" cy="16" r="14" fill="#3b82f6" stroke="#93c5fd" stroke-width="3" />
          <circle cx="16" cy="16" r="5" fill="#ffffff" />
          <rect x="42" y="8" width="150" height="16" rx="6" fill="#93c5fd" />
        </g>
      </g>

      <!-- Lápis amigo carismático auxiliando na lista -->
      <g filter="url(#dropShadow)" transform="translate(450, 150) rotate(-25)">
        <polygon points="15,0 30,0 22,-20" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />
        <polygon points="20,-15 25,-15 22,-20" fill="#1e293b" />
        <rect x="15" y="0" width="15" height="90" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
        <rect x="15" y="90" width="15" height="15" rx="3" fill="#ec4899" stroke="#be185d" stroke-width="1.5" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Passo a Passo</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">ANÁLISE DE TAREFAS & ENCADINHAMENTO</text>
  </g>
</svg>
