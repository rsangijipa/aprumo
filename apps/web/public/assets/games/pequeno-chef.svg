<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Bancada de cozinha de madeira acolhedora -->
      <path d="M0,230 Q320,215 640,230 L640,360 L0,360 Z" fill="#78350f" />

      <!-- Chapéu de Mestre Cuca fofo (Chef Hat) flutuante -->
      <g filter="url(#dropShadow)" transform="translate(255, 30)">
        <path d="M25,65 Q10,25 45,20 Q65,-10 85,20 Q120,25 105,65 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
        <rect x="25" y="65" width="80" height="22" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
        <line x1="38" y1="65" x2="38" y2="87" stroke="#cbd5e1" stroke-width="2" />
        <line x1="65" y1="65" x2="65" y2="87" stroke="#cbd5e1" stroke-width="2" />
        <line x1="92" y1="65" x2="92" y2="87" stroke="#cbd5e1" stroke-width="2" />
      </g>

      <!-- Prato com Pizza deliciosa sendo montada em passos -->
      <g filter="url(#dropShadow)" transform="translate(230, 130)">
        <circle cx="90" cy="80" r="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" />
        <!-- Massa dourada da pizza -->
        <circle cx="90" cy="80" r="70" fill="#f59e0b" stroke="#d97706" stroke-width="3" />
        <!-- Molho de tomate e queijo derretido -->
        <circle cx="90" cy="80" r="58" fill="#fef08a" />
        <!-- Fatias de tomate e azeitonas saborosas -->
        <circle cx="70" cy="65" r="12" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
        <circle cx="110" cy="70" r="12" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
        <circle cx="90" cy="100" r="12" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
        <circle cx="90" cy="65" r="6" fill="#1e293b" />
        <circle cx="72" cy="95" r="6" fill="#1e293b" />
        <circle cx="112" cy="95" r="6" fill="#1e293b" />
        <!-- Folhinhas de manjericão fresco -->
        <path d="M80,75 Q88,70 85,82 Z" fill="#22c55e" />
        <path d="M100,85 Q108,80 105,92 Z" fill="#22c55e" />
      </g>

      <!-- Colher de pau alegre com carinha sorridente -->
      <g filter="url(#dropShadow)" transform="translate(100, 160) rotate(25)">
        <rect x="25" y="45" width="14" height="90" rx="7" fill="#d97706" />
        <ellipse cx="32" cy="35" rx="22" ry="30" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
        <circle cx="26" cy="30" r="2.5" fill="#78350f" />
        <circle cx="38" cy="30" r="2.5" fill="#78350f" />
        <path d="M28,40 Q32,45 36,40" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>

      <!-- Rolo de massa de madeira à direita -->
      <g filter="url(#dropShadow)" transform="translate(460, 160) rotate(-20)">
        <rect x="20" y="25" width="12" height="100" rx="6" fill="#d97706" />
        <rect x="10" y="40" width="32" height="70" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Pequeno Chef</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">SEGUIDO DE RECEITA & COGNIÇÃO</text>
  </g>
</svg>
