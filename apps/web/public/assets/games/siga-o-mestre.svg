<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Cenário de aventura com pegadas coloridas na trilha -->
      <path d="M60,320 C160,260 220,290 320,220 C420,150 480,200 580,120" stroke="#fde047" stroke-width="52" stroke-linecap="round" fill="none" opacity="0.3" />
      <path d="M60,320 C160,260 220,290 320,220 C420,150 480,200 580,120" stroke="#3b82f6" stroke-width="40" stroke-linecap="round" fill="none" />

      <!-- Pegadas infantis coloridas no chão marcando passos -->
      <g fill="#ffffff" opacity="0.8">
        <ellipse cx="120" cy="300" rx="10" ry="15" transform="rotate(20, 120, 300)" />
        <ellipse cx="170" cy="275" rx="10" ry="15" transform="rotate(-15, 170, 275)" />
        <ellipse cx="230" cy="265" rx="10" ry="15" transform="rotate(25, 230, 265)" />
        <ellipse cx="280" cy="240" rx="10" ry="15" transform="rotate(-10, 280, 240)" />
      </g>

      <!-- Mascote Mestre (Cachorrinho aventureiro de boné mostrando pose) -->
      <g filter="url(#dropShadow)" transform="translate(320, 70)">
        <ellipse cx="65" cy="140" rx="42" ry="12" fill="#000000" opacity="0.3" />
        <!-- Orelhas caídas fofas -->
        <ellipse cx="25" cy="65" rx="14" ry="26" fill="#78350f" transform="rotate(-15, 25, 65)" />
        <ellipse cx="105" cy="65" rx="14" ry="26" fill="#78350f" transform="rotate(15, 105, 65)" />
        <!-- Cabeça bege macia -->
        <circle cx="65" cy="65" r="42" fill="#fde68a" stroke="#d97706" stroke-width="2.5" />
        <!-- Boné de capitão mestre -->
        <path d="M30,45 C30,20 100,20 100,45 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
        <rect x="25" y="42" width="80" height="8" rx="4" fill="#3b82f6" />
        <path d="M65,42 Q115,45 110,35" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />
        <!-- Olhinhos cheios de energia -->
        <circle cx="52" cy="60" r="4.5" fill="#1e293b" />
        <circle cx="78" cy="60" r="4.5" fill="#1e293b" />
        <circle cx="53" cy="58" r="1.5" fill="#ffffff" />
        <circle cx="79" cy="58" r="1.5" fill="#ffffff" />
        <ellipse cx="65" cy="72" rx="7" ry="5" fill="#78350f" />
        <path d="M57,80 Q65,88 73,80" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />
        <!-- Pata fazendo pose de continência divertida -->
        <path d="M100,80 L125,55 C128,52 133,56 128,60 L108,92 Z" fill="#fde68a" stroke="#d97706" stroke-width="2.5" />
      </g>

      <!-- Bandeirinha de Guia "1, 2, 3... JÁ!" -->
      <g filter="url(#dropShadow)" transform="translate(140, 110)">
        <circle cx="35" cy="35" r="30" fill="#facc15" stroke="#ffffff" stroke-width="3" />
        <text x="35" y="42" fill="#78350f" font-size="20" font-weight="900" text-anchor="middle">★</text>
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Siga o Mestre</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">IMITAÇÃO MOTORA & EQUILÍBRIO</text>
  </g>
</svg>
