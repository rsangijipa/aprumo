<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Mini cidade 3D agradável com prédios coloridos e faixa de pedestres -->
      <!-- Rua em perspectiva -->
      <polygon points="0,290 640,290 640,360 0,360" fill="#334155" />
      <!-- Faixa de pedestres com zebrado branco iluminado -->
      <g fill="#ffffff">
        <rect x="220" y="300" width="35" height="45" rx="4" />
        <rect x="270" y="300" width="35" height="45" rx="4" />
        <rect x="320" y="300" width="35" height="45" rx="4" />
        <rect x="370" y="300" width="35" height="45" rx="4" />
      </g>

      <!-- Prédio 1: Escola azul amigável -->
      <g filter="url(#dropShadow)" transform="translate(80, 110)">
        <rect x="0" y="30" width="120" height="150" rx="12" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />
        <!-- Janelas iluminadas da escola -->
        <rect x="18" y="55" width="24" height="24" rx="4" fill="#fef08a" />
        <rect x="52" y="55" width="24" height="24" rx="4" fill="#fef08a" />
        <rect x="84" y="55" width="24" height="24" rx="4" fill="#fef08a" />
        <rect x="18" y="95" width="24" height="24" rx="4" fill="#fef08a" />
        <rect x="52" y="95" width="24" height="24" rx="4" fill="#fef08a" />
        <rect x="84" y="95" width="24" height="24" rx="4" fill="#fef08a" />
        <!-- Portinha dupla -->
        <rect x="42" y="140" width="36" height="40" rx="6" fill="#ffffff" />
        <!-- Relógio no topo da escola -->
        <circle cx="60" cy="20" r="16" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
        <line x1="60" y1="20" x2="60" y2="12" stroke="#0284c7" stroke-width="2" />
        <line x1="60" y1="20" x2="66" y2="20" stroke="#0284c7" stroke-width="2" />
      </g>

      <!-- Prédio 2: Parquinho / Biblioteca Verde com Telhado Inclinado -->
      <g filter="url(#dropShadow)" transform="translate(230, 90)">
        <polygon points="10,40 60,10 110,40" fill="#f97316" stroke="#ea580c" stroke-width="2" />
        <rect x="10" y="40" width="100" height="150" rx="10" fill="#10b981" stroke="#34d399" stroke-width="2.5" />
        <rect x="25" y="60" width="30" height="30" rx="6" fill="#fef08a" />
        <rect x="65" y="60" width="30" height="30" rx="6" fill="#fef08a" />
      </g>

      <!-- Semáforo amigável com luz verde acesa brilhando -->
      <g filter="url(#dropShadow)" transform="translate(430, 150)">
        <rect x="18" y="50" width="8" height="90" rx="4" fill="#475569" />
        <rect x="4" y="0" width="36" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
        <circle cx="22" cy="18" r="7" fill="#ef4444" opacity="0.3" />
        <circle cx="22" cy="35" r="7" fill="#facc15" opacity="0.3" />
        <circle cx="22" cy="52" r="8" fill="#22c55e" stroke="#86efac" stroke-width="2" />
        <circle cx="22" cy="52" r="3" fill="#ffffff" />
      </g>

      <!-- Dois amigos se cumprimentando na calçada alegremente -->
      <g filter="url(#dropShadow)" transform="translate(480, 200)">
        <!-- Amigo 1 com mãozinha acenando -->
        <circle cx="30" cy="30" r="18" fill="#fde047" stroke="#ca8a04" stroke-width="2" />
        <circle cx="25" cy="27" r="2.5" fill="#1e293b" />
        <circle cx="35" cy="27" r="2.5" fill="#1e293b" />
        <path d="M26,34 Q30,38 34,34" stroke="#1e293b" stroke-width="2" fill="none" />
        <!-- Aceno -->
        <path d="M44,30 Q54,15 48,10" stroke="#fde047" stroke-width="4" stroke-linecap="round" fill="none" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Social City 3D</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">HABILIDADES SOCIAIS EM CONTEXTO</text>
  </g>
</svg>
