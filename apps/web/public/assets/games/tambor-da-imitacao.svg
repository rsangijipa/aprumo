<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#f87171" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>

  <!-- Fundo com gradiente imersivo e iluminação radial -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#ambientGlow)" />

  <!-- Vinheta sutil e textura de profundidade -->
  <circle cx="80" cy="60" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="560" cy="300" r="180" fill="#ffffff" opacity="0.04" />

  <!-- Arte do Jogo com Iluminação e Profundidade 3D -->
  
      <!-- Tambor Bongo acústico vibrante e colorido central -->
      <g filter="url(#dropShadow)" transform="translate(210, 110)">
        <ellipse cx="110" cy="160" rx="90" ry="24" fill="#000000" opacity="0.35" />

        <!-- Corpo cônico do tambor em madeira nobre e vermelho -->
        <path d="M30,55 C30,130 55,160 110,160 C165,160 190,130 190,55 Z" fill="#dc2626" stroke="#facc15" stroke-width="3" />
        <path d="M50,75 L80,155 M110,75 L110,160 M170,75 L140,155" stroke="#facc15" stroke-width="3" stroke-dasharray="6 4" />

        <!-- Pele de couro do tambor -->
        <ellipse cx="110" cy="55" rx="80" ry="24" fill="#fef08a" stroke="#ca8a04" stroke-width="3.5" />
        <ellipse cx="110" cy="55" rx="60" ry="16" fill="#fef9c3" />

        <!-- Ponto de impacto vibrante da batida no centro -->
        <circle cx="110" cy="55" r="20" fill="#fde047" opacity="0.4" />
        <circle cx="110" cy="55" r="8" fill="#ffffff" />
      </g>

      <!-- Duas Baquetas de madeira tocando com ritmo e energia -->
      <!-- Baqueta 1 (Esquerda) -->
      <g filter="url(#dropShadow)" transform="translate(140, 60) rotate(35)">
        <rect x="0" y="0" width="12" height="110" rx="6" fill="#d97706" stroke="#92400e" stroke-width="1.5" />
        <circle cx="6" cy="0" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" />
      </g>

      <!-- Baqueta 2 (Direita) -->
      <g filter="url(#dropShadow)" transform="translate(450, 60) rotate(-35)">
        <rect x="0" y="0" width="12" height="110" rx="6" fill="#d97706" stroke="#92400e" stroke-width="1.5" />
        <circle cx="6" cy="0" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5" />
      </g>

      <!-- Ondas de som estéreo e notas musicais coloridas alegres -->
      <g filter="url(#dropShadow)">
        <!-- Ondas sonoras concêntricas -->
        <path d="M260,110 Q320,80 380,110" stroke="#fde047" stroke-width="5" stroke-linecap="round" fill="none" />
        <path d="M230,90 Q320,50 410,90" stroke="#fde047" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />

        <!-- Notas musicais saltando -->
        <path d="M160,80 L160,50 L185,42 L185,72" stroke="#facc15" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <ellipse cx="155" cy="82" rx="8" ry="5.5" fill="#facc15" transform="rotate(-20, 155, 82)" />
        <ellipse cx="180" cy="74" rx="8" ry="5.5" fill="#facc15" transform="rotate(-20, 180, 74)" />

        <path d="M460,95 L460,70 L480,62 L480,87" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <ellipse cx="455" cy="97" rx="8" ry="5.5" fill="#38bdf8" transform="rotate(-20, 455, 97)" />
        <ellipse cx="475" cy="89" rx="8" ry="5.5" fill="#38bdf8" transform="rotate(-20, 475, 89)" />
      </g>
    

  <!-- Placa Transtranslúcida Inferior com Nome do Jogo e Habilidade Clínica -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="272" width="560" height="66" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <text x="320" y="302" text-anchor="middle" fill="#ffffff" font-family="'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="0.01em">Tambor da Imitação</text>
    <text x="320" y="323" text-anchor="middle" fill="#fde047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="750" letter-spacing="0.06em">RITMO, IMITAÇÃO & COORDENAÇÃO</text>
  </g>
</svg>
