<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Sombra suave no chão -->
    <radialGradient id="apple-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente 3D da massa da maçã (Soft-clay red) -->
    <radialGradient id="apple-body" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="25%" stop-color="#ee3838" />
      <stop offset="70%" stop-color="#c91a1a" />
      <stop offset="92%" stop-color="#910f0f" />
      <stop offset="100%" stop-color="#6b0808" />
    </radialGradient>

    <!-- Brilho especular difuso (Clay sheen) -->
    <linearGradient id="apple-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente do cabinho de argila -->
    <linearGradient id="apple-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#785028" />
      <stop offset="50%" stop-color="#543719" />
      <stop offset="100%" stop-color="#3b230d" />
    </linearGradient>

    <!-- Luz de rebatimento inferior (Bounce light) -->
    <radialGradient id="apple-bounce" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#ffaaaa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffaaaa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo branco de estúdio conforme especificação -->
  <rect width="1024" height="1024" fill="#ffffff" />

  <!-- Sombra de contato -->
  <ellipse cx="512" cy="880" rx="320" ry="55" fill="url(#apple-shadow)" />
  <ellipse cx="512" cy="875" rx="190" ry="32" fill="url(#apple-shadow)" />

  <!-- Cabinho de argila tátil curvado -->
  <path d="M 512 290 C 510 220, 545 160, 580 130 C 590 120, 605 130, 595 145 C 565 180, 538 230, 532 295 Z" fill="url(#apple-stem)" />
  <ellipse cx="512" cy="290" rx="22" ry="12" fill="#422509" opacity="0.75" />

  <!-- Corpo da maçã de argila macia (Soft-clay) -->
  <path d="M 512 300
           C 420 230, 240 250, 180 390
           C 110 550, 190 780, 370 850
           C 440 878, 485 860, 512 840
           C 539 860, 584 878, 654 850
           C 834 780, 914 550, 844 390
           C 784 250, 604 230, 512 300 Z"
        fill="url(#apple-body)" />

  <!-- Luz de rebatimento inferior -->
  <path d="M 512 300
           C 420 230, 240 250, 180 390
           C 110 550, 190 780, 370 850
           C 440 878, 485 860, 512 840
           C 539 860, 584 878, 654 850
           C 834 780, 914 550, 844 390
           C 784 250, 604 230, 512 300 Z"
        fill="url(#apple-bounce)" />

  <!-- Brilho especular suave modelando a volumetria tátil -->
  <ellipse cx="360" cy="420" rx="140" ry="110" transform="rotate(-30 360 420)" fill="url(#apple-highlight)" />
  <ellipse cx="330" cy="380" rx="60" ry="40" transform="rotate(-30 330 380)" fill="#ffffff" opacity="0.45" />

  <!-- Covinha superior da maçã -->
  <ellipse cx="512" cy="300" rx="50" ry="20" fill="#4d0808" opacity="0.55" />
</svg>
